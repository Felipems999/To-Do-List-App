version: "3.8"

services:
    db:
        image: postgres:15-alpine
        environment:
            POSTGRES_USER: todo_user
            POSTGRES_PASSWORD: todo_password
            POSTGRES_DB: todo_db
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    backend:
        build: ./backend
        command: python manage.py runserver 0.0.0.0:8000
        volumes:
            - ./backend:/app
        ports:
            - "8000:8000"
        depends_on:
            - db
        environment:
            - DATABASE_URL=postgres://todo_user:todo_password@db:5432/todo_db

    frontend:
        build: ./frontend
        command: npm run dev -- --host
        volumes:
            - ./frontend:/app
            - /app/node_modules
        ports:
            - "5173:5173"
        depends_on:
            - backend

volumes:
    postgres_data:
